<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #quiz-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    h2 {
      margin-bottom: 15px;
    }
    .option {
      display: block;
      margin: 8px 0;
      padding: 10px;
      background: #eee;
      border-radius: 5px;
      cursor: pointer;
    }
    .option:hover {
      background: #ddd;
    }
    #navigation {
      margin-top: 15px;
    }
    button {
      padding: 8px 12px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #007bff;
      color: #fff;
    }
    button:hover {
      background: #0056b3;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="quiz-container">
    <h2 id="question"></h2>
    <div id="options"></div>
    <div id="navigation">
      <button onclick="prevQuestion()">Previous</button>
      <button onclick="nextQuestion()">Next</button>
      <button onclick="submitQuiz()">Submit</button>
    </div>
    <div id="result"></div>
    <div id="high-score"></div>
  </div>

  <script>
    const questions = [
      {
        question: "Which language runs in a web browser?",
        options: ["Java", "C", "Python", "JavaScript"],
        answer: "JavaScript"
      },
      {
        question: "What does CSS stand for?",
        options: ["Central Style Sheets", "Cascading Style Sheets", "Computer Style Sheets", "Creative Style System"],
        answer: "Cascading Style Sheets"
      },
      {
        question: "What does HTML stand for?",
        options: ["Hypertext Markup Language", "Hypertext Markdown Language", "Hyperloop Machine Language", "None of the above"],
        answer: "Hypertext Markup Language"
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let userAnswers = {};

    function loadQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question").innerText = q.question;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("div");
        btn.innerText = opt;
        btn.className = "option";
        btn.onclick = () => selectAnswer(opt);
        if (userAnswers[currentQuestion] === opt) {
          btn.style.background = "#b3d9ff";
        }
        optionsDiv.appendChild(btn);
      });
    }

    function selectAnswer(opt) {
      userAnswers[currentQuestion] = opt;
      loadQuestion();
    }

    function nextQuestion() {
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        loadQuestion();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        loadQuestion();
      }
    }

    function submitQuiz() {
      score = 0;
      questions.forEach((q, index) => {
        if (userAnswers[index] === q.answer) {
          score++;
        }
      });
      document.getElementById("result").innerText = `Your Score: ${score}/${questions.length}`;

      // Store highest score in localStorage
      let highScore = localStorage.getItem("highScore") || 0;
      if (score > highScore) {
        localStorage.setItem("highScore", score);
        highScore = score;
      }
      document.getElementById("high-score").innerText = `Highest Score: ${highScore}`;
    }

    // Display high score on load
    window.onload = () => {
      loadQuestion();
      let highScore = localStorage.getItem("highScore") || 0;
      document.getElementById("high-score").innerText = `Highest Score: ${highScore}`;
    };
  </script>
</body>
</html>
